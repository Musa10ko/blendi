# .github/workflows/typecheck.yml
name: TypeCheck

on: [push, pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bun/action-setup@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'bun'
      - run: bun install
      - run: bun typecheck